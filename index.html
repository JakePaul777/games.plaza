<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>games.plaza</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header><img src="media/logo.png" id="logo"></header>
    <div id="main">
        <div id="window">
            <button id="prev-btn" class="arrow-btn" onclick="changePage(-1)">&#10094;</button>
            <div id="grid">
            </div>
            <button id="next-btn" class="arrow-btn" onclick="changePage(1)">&#10095;</button>
        </div>
    </div>

    <div id="cover">
        <button id="enterbut" onclick="
            document.getElementById('cover').style.opacity=0; 
            music.play();
            setTimeout(()=>{
                document.getElementById('cover').style.display = 'none';
            }, 1000)">Enter</button>
        <button id="gobackbut" onclick="
            document.getElementById('cover').style.opacity=0; 
            music.play();
            setTimeout(()=>{
                document.getElementById('cover').style.display = 'none';
            }, 1000)">Go Back</button>
    </div>
    <div id="tooltip"></div>
    <script src="script.js"></script>
</body>
</html>
