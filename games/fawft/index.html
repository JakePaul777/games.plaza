    <script type="text/javascript">
        var _azerionIntegration = {

        var gameName = "fireboy-and-watergirl-forest-temple.min.js";

        // No cache-busting / version display: null makes the game's loader skip the "?v=" suffix.
        var version = null;

        // --- Load watchdog -------------------------------------------------
        // Rapid reloads (Ctrl+F5 twice) can leave the loader stuck at 0. If the game hasn't
        // got past startup after WATCHDOG_MS, reload once more automatically (max 3 tries).
        (function() {
            var WATCHDOG_MS = 10000, MAX_TRIES = 3, KEY = "fbwg_retries";
            var splashDone = false;
            var origLog = console.log;
            console.log = function(m) {
                if (m === "Splash Loaded") splashDone = true;
                return origLog.apply(console, arguments);
            };

            function started() {
                if (splashDone) return true;
                var g = window.Phaser && Phaser.GAMES && Phaser.GAMES[0];
                if (!g) return false;
                if (g.load && g.load.progress > 0) return true;
                var st = g.state && g.state.current;
                return !!st && st !== "boot" && st !== "load";
            }

            setTimeout(function() {
                var tries = 0;
                try { tries = parseInt(sessionStorage.getItem(KEY) || "0", 10) || 0; } catch (e) {}
                if (started()) {
                    try { sessionStorage.removeItem(KEY); } catch (e) {}
                    return;
                }
                if (tries >= MAX_TRIES) return;
                try { sessionStorage.setItem(KEY, String(tries + 1)); } catch (e) {}
                location.reload();
            }, WATCHDOG_MS);
        })();

        require(["fireboy-and-watergirl-forest-temple.min.js"]);
    </script>
