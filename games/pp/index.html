<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>people playground.</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
      /* Always fill the whole window, fullscreen or not */
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
        background: #000;
      }
      #unity-container,
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        transform: none !important;
        margin: 0 !important;
      }
      #unity-canvas {
        display: block !important;
        width: 100% !important;
        height: 100% !important;
        background: #000;
      }

      #xp-loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-family: Tahoma, Arial, sans-serif;
        font-size: 24px;
        z-index: 10;
      }
      /* No links or footer stuff on the loading screen */
      #xp-loader a,
      #unity-footer,
      #unity-logo,
      #unity-progress-bar-empty {
        display: none !important;
      }
      /* Hide any stray text/overlays above the loader; keep only the bar and the game */
      body > *:not(#xp-loader):not(#unity-container):not(script) {
        display: none !important;
      }
      #unity-container > *:not(#unity-canvas):not(#unity-warning) {
        display: none !important;
      }
      #unity-loading-bar {
        display: none;
      }
    </style>
  </head>
  <body>
    <script>
      // Stop the game from jumping into fullscreen on the first click
      (function () {
        var noop = function () { return Promise.resolve(); };
        ["requestFullscreen", "webkitRequestFullscreen", "webkitRequestFullScreen",
         "mozRequestFullScreen", "msRequestFullscreen"].forEach(function (name) {
          if (Element.prototype[name]) Element.prototype[name] = noop;
        });
      })();
    </script>
    <div id="xp-loader">loading</div>

    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-warning"></div>
    </div>
    <script>
      window.fileMergerConfig = {
        files: [
          { name: 'pggbog.data', parts: 7 },
          { name: 'pggbog.wasm', parts: 3 }
        ],
        basePath: 'Build/',
        debug: false
      };
  </script>
  <script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/merge.js"></script>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var canvas = document.querySelector("#unity-canvas");
      var xpBox = document.querySelector("#xp-loader");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/pggbog.loader.js";
      var config = {
        dataUrl: buildUrl + "/pggbog.data",
        frameworkUrl: buildUrl + "/pggbog.framework.js",
        codeUrl: buildUrl + "/pggbog.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Studio Minus",
        productName: "People Playground",
        productVersion: "1",
        showBanner: unityShowBanner
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config).then((unityInstance) => {
          xpBox.style.display = "none";
          // Nudge Unity to re-measure the canvas whenever the window changes
          var fit = function () { window.dispatchEvent(new Event("resize")); };
          document.addEventListener("fullscreenchange", function () { setTimeout(fit, 50); });
          window.addEventListener("orientationchange", function () { setTimeout(fit, 100); });
          fit();
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
